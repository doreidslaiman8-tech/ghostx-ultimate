plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    compileSdk 31
    defaultConfig {
        applicationId "com.ghostx.ultimate"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        python {
            buildPython "/usr/bin/python3"
            pip {
                install "flask"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
}
